name: Build PS4 AI-Doctor
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential clang lld git

      - name: Setup and Build OpenOrbis Toolchain
        run: |
          git clone https://github.com/OpenOrbis/OpenOrbis-PS4-Toolchain.git
          cd OpenOrbis-PS4-Toolchain
          chmod +x build.sh
          sudo ./build.sh
          sudo mkdir -p /opt/toolchain
          sudo cp -r * /opt/toolchain/

      - name: Build PS4 Homebrew
        run: |
          export OO_PS4_TOOLCHAIN=/opt/toolchain
          export PATH=$OO_PS4_TOOLCHAIN/bin/linux:$PATH
          make

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eboot
          path: eboot.bin
